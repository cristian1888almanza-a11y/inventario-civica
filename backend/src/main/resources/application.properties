spring.application.name=task-manager-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/inventorydb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.depreciation.cron=${DEPRECIATION_CRON:0 15 2 1 * *}
app.depreciation.zone=${DEPRECIATION_ZONE:America/Bogota}
